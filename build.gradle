plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file("src/main/resources/overseer.accesswidener")

    runs {
        configureEach {
            // HotSpot's C2 compiler can crash the whole JVM in its ReduceAllocationMerges
            // optimisation (JDK 22 and later, on by default). It took the dev client down mid
            // session while compiling the per-frame portal render. The code that triggered it has
            // been rewritten to avoid the pattern, but the optimisation can fire on any method,
            // so it is also switched off for dev runs. The first flag keeps this harmless on a
            // JDK too old to know the option; the second is needed because it is a diagnostic one.
            vmArgs "-XX:+IgnoreUnrecognizedVMOptions", "-XX:+UnlockDiagnosticVMOptions", "-XX:-ReduceAllocationMerges"
        }
    }
}

repositories {
    // Modrinth
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    // Mod Menu
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }

    // MixinSquared
    maven { url "https://maven.bawnorton.com/releases" }

    // CCA
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }

    // Nebulon
    maven {
        name = "RiftRealms"
        url = 'https://maven.riftrealms.de/releases'
    }
}

fabricApi {
	configureDataGeneration {
        modId = "overseer"
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // MixinSquared
    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${project.mixinsquared_version}")))

    // Libraries
    modImplementation "maven.modrinth:acornlib:${project.acornlib_version}"
    modImplementation "de.nexusrealms:nebulon:${project.nebulon_version}"

    // Config
    modApi "com.terraformersmc:modmenu:${project.modmenu_version}"
    modImplementation "maven.modrinth:midnightlib:${project.midnightlib_version}"

    // CCA
    modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
    modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}")
    modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cca_version}")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {}
}
